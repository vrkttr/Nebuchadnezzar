<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Projekt Nebuchadnezzar</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
    #nameplates {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .nameplate {
      position: absolute;
      transform: translate(-50%, -100%);
      color: #ffffff;
      font-family: sans-serif;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 0 4px #000000, 0 0 4px #000000;
      white-space: nowrap;
    }
    #dialogue-box {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 16px 24px;
      border-radius: 8px;
      max-width: 480px;
      font-family: sans-serif;
      font-size: 15px;
      text-align: center;
    }
    #dialogue-box.hidden {
      display: none;
    }
    #dialogue-box button {
      display: block;
      margin: 12px auto 0;
      padding: 6px 16px;
      cursor: pointer;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="nameplates"></div>
  <div id="dialogue-box" class="hidden">
    <p id="dialogue-text"></p>
    <button id="dialogue-close">Schließen</button>
  </div>
  <script type="module" src="js/main.js?v=14"></script>
</body>
</html>
