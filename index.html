<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Projekt Nebuchadnezzar</title>
  <style>
    :root {
      --c-bg-panel: rgba(17, 17, 13, 0.9);
      --c-bg-panel-solid: #121210;
      --c-border: #4d4a3c;
      --c-border-bright: #d98f2b;
      --c-text: #d8d3c0;
      --c-text-dim: #756f5c;
      --c-health-a: #b0342a;
      --c-health-b: #430f0a;
      --c-resource-a: #2ba7a1;
      --c-resource-b: #103c3a;
      --c-xp-a: #d98f2b;
      --c-xp-b: #4a2d0c;
      --c-slot-bg: #0c0c09;
      --font-display: Consolas, 'Courier New', ui-monospace, monospace;
      --font-ui: 'Segoe UI', system-ui, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
    }

    #nameplates {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .nameplate {
      position: absolute;
      transform: translate(-50%, -100%);
      color: #ffffff;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: bold;
      text-shadow: 0 0 4px #000000, 0 0 4px #000000;
      white-space: nowrap;
    }

    .nameplate-enemy {
      color: #e0553d;
    }

    #dialogue-box {
      position: fixed;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--c-bg-panel);
      border: 2px solid var(--c-border-bright);
      border-radius: 2px;
      color: var(--c-text);
      padding: 16px 24px;
      max-width: 480px;
      font-family: var(--font-ui);
      font-size: 15px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    }

    #dialogue-box.hidden {
      display: none;
    }

    #dialogue-box button {
      display: block;
      margin: 12px auto 0;
      padding: 6px 18px;
      background: var(--c-bg-panel-solid);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      border-radius: 2px;
      font-family: var(--font-ui);
      cursor: pointer;
    }

    #dialogue-box button:hover {
      border-color: var(--c-border-bright);
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .frame {
      position: fixed;
      display: flex;
      gap: 10px;
      width: 230px;
      padding: 8px;
      background: var(--c-bg-panel);
      border: 2px solid var(--c-border);
      border-radius: 2px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .frame.hidden {
      display: none;
    }

    #player-frame {
      top: 20px;
      left: 16px;
    }

    #player-frame::before {
      content: '';
      position: absolute;
      top: -6px;
      left: -2px;
      right: -2px;
      height: 4px;
      background: repeating-linear-gradient(45deg, var(--c-border-bright) 0 8px, #1a1a14 8px 16px);
    }

    #target-frame {
      top: 20px;
      left: 264px;
    }

    .portrait {
      flex: 0 0 auto;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--c-border-bright);
      background: radial-gradient(circle at 35% 30%, #3a372c, #121210);
    }

    .frame-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .name-level {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-display);
      color: var(--c-text);
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .level-badge {
      flex: 0 0 auto;
      background: var(--c-border-bright);
      color: #241a08;
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 2px;
      margin-left: 6px;
    }

    .bar {
      position: relative;
      height: 14px;
      background: var(--c-slot-bg);
      border: 1px solid var(--c-border);
      border-radius: 1px;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      inset: 0;
      width: 100%;
      transition: width 0.25s ease;
    }

    .health-bar .bar-fill {
      background: linear-gradient(var(--c-health-a), var(--c-health-b));
    }

    .resource-bar .bar-fill {
      background: linear-gradient(var(--c-resource-a), var(--c-resource-b));
    }

    .bar-text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 10px;
      color: var(--c-text);
      text-shadow: 0 1px 2px #000000;
    }

    #cast-bar {
      position: fixed;
      top: 96px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 18px;
      background: var(--c-slot-bg);
      border: 1px solid var(--c-border);
      border-radius: 1px;
      overflow: hidden;
    }

    #cast-bar.hidden {
      display: none;
    }

    #cast-bar-fill {
      background: linear-gradient(90deg, var(--c-resource-b), var(--c-resource-a));
    }

    #minimap {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 180px;
    }

    #minimap-circle {
      position: relative;
      width: 150px;
      height: 150px;
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
      border: 3px solid var(--c-border-bright);
      background: radial-gradient(circle at 42% 35%, #4a4234, #17150f 75%);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    #minimap-circle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 12px solid var(--c-border-bright);
      transform: translate(-50%, -70%);
    }

    #zone-name {
      margin-top: 6px;
      font-family: var(--font-display);
      color: var(--c-text);
      font-size: 13px;
      text-shadow: 0 1px 2px #000000;
    }

    #minimap-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      margin-top: 8px;
    }

    #minimap-buttons button {
      pointer-events: auto;
      width: 24px;
      height: 24px;
      border-radius: 2px;
      background: var(--c-bg-panel-solid);
      border: 1px solid var(--c-border);
      color: var(--c-text-dim);
      font-family: var(--font-display);
      font-size: 10px;
      cursor: pointer;
    }

    #minimap-buttons button:hover {
      border-color: var(--c-border-bright);
      color: var(--c-text);
    }

    #buff-bar {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      min-height: 28px;
    }

    #quest-tracker {
      position: fixed;
      top: 236px;
      right: 16px;
      width: 210px;
      padding: 10px 12px;
      background: var(--c-bg-panel);
      border-left: 3px solid var(--c-border-bright);
      border-radius: 1px;
    }

    .panel-title {
      font-family: var(--font-display);
      color: var(--c-border-bright);
      font-size: 14px;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--c-border);
    }

    .empty-state {
      color: var(--c-text-dim);
      font-family: var(--font-ui);
      font-size: 12px;
      font-style: italic;
    }

    #action-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 6px;
      background: var(--c-bg-panel);
      border: 2px solid var(--c-border);
      border-radius: 2px;
    }

    .action-slot {
      pointer-events: auto;
      position: relative;
      width: 42px;
      height: 42px;
      background: var(--c-slot-bg);
      border: 1px solid var(--c-border);
      border-radius: 1px;
      cursor: pointer;
    }

    .action-slot:hover {
      border-color: var(--c-border-bright);
    }

    .slot-key {
      position: absolute;
      top: 2px;
      left: 4px;
      font-family: var(--font-display);
      z-index: 2;
      font-size: 10px;
      color: var(--c-text-dim);
      text-shadow: 0 1px 2px #000000;
    }

    .slot-name {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: bold;
      color: var(--c-border-bright);
      pointer-events: none;
    }

    .slot-cooldown {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    .slot-cooldown-text {
      position: absolute;
      bottom: 12px;
      font-family: var(--font-display);
      font-size: 16px;
      color: var(--c-text);
      text-shadow: 0 1px 2px #000000;
    }

    .action-slot.slot-unaffordable .slot-name {
      color: var(--c-text-dim);
    }

    #chat-window {
      position: fixed;
      bottom: 16px;
      left: 16px;
      width: 320px;
      max-height: 160px;
      display: flex;
      flex-direction: column;
      background: var(--c-bg-panel);
      border: 1px solid var(--c-border);
      border-radius: 2px;
      overflow: hidden;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--c-text);
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-height: 60px;
    }

    .chat-line-system {
      color: var(--c-border-bright);
    }

    #chat-input {
      pointer-events: auto;
      border: none;
      border-top: 1px solid var(--c-border);
      background: var(--c-bg-panel-solid);
      color: var(--c-text-dim);
      font-family: var(--font-ui);
      font-size: 12px;
      padding: 6px 8px;
    }

    #chat-input::placeholder {
      color: var(--c-text-dim);
    }

    #chat-input:disabled {
      cursor: not-allowed;
    }

    #bag-bar {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      gap: 4px;
    }

    .bag-slot {
      pointer-events: auto;
      width: 36px;
      height: 36px;
      background: var(--c-slot-bg);
      border: 1px solid var(--c-border);
      border-radius: 1px;
      cursor: pointer;
    }

    .bag-slot:hover {
      border-color: var(--c-border-bright);
    }

    .window {
      position: fixed;
      background: var(--c-bg-panel);
      border: 2px solid var(--c-border);
      border-radius: 2px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      color: var(--c-text);
      font-family: var(--font-ui);
    }

    .window.hidden {
      display: none;
    }

    .window-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-bottom: 1px solid var(--c-border);
    }

    .window-title {
      font-family: var(--font-display);
      font-size: 14px;
      color: var(--c-border-bright);
    }

    .window-close {
      background: none;
      border: none;
      color: var(--c-text-dim);
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
    }

    .window-close:hover {
      color: var(--c-text);
    }

    .window-button {
      padding: 6px 18px;
      background: var(--c-bg-panel-solid);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      border-radius: 2px;
      font-family: var(--font-ui);
      cursor: pointer;
    }

    .window-button:hover {
      border-color: var(--c-border-bright);
    }

    .quality-uncommon {
      border-color: #3f9b4a;
    }

    .quality-rare {
      border-color: #3b78d1;
    }

    .quality-epic {
      border-color: #9a4bd1;
    }

    #inventory-window {
      right: 16px;
      bottom: 110px;
      width: 286px;
    }

    #inventory-grid {
      display: grid;
      grid-template-columns: repeat(6, 42px);
      gap: 4px;
      padding: 10px;
    }

    .inventory-slot {
      position: relative;
      width: 42px;
      height: 42px;
      box-sizing: border-box;
      background: var(--c-slot-bg);
      border: 1px solid var(--c-border);
      border-radius: 1px;
    }

    .inventory-slot.quality-uncommon {
      border-color: #3f9b4a;
    }

    .inventory-slot.quality-rare {
      border-color: #3b78d1;
    }

    .inventory-slot.quality-epic {
      border-color: #9a4bd1;
    }

    .item-short {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: bold;
      color: var(--c-text);
      pointer-events: none;
    }

    .item-count {
      position: absolute;
      right: 3px;
      bottom: 1px;
      font-family: var(--font-display);
      font-size: 11px;
      color: var(--c-text);
      text-shadow: 0 1px 2px #000000;
      pointer-events: none;
    }

    #loot-window {
      left: 16px;
      top: 120px;
      width: 250px;
    }

    #loot-entries {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      max-height: 240px;
      overflow-y: auto;
    }

    .loot-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 4px 6px;
      background: var(--c-bg-panel-solid);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      border-radius: 2px;
      font-family: var(--font-ui);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }

    .loot-entry:hover {
      border-color: var(--c-border-bright);
    }

    .loot-entry-icon {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--c-slot-bg);
      border: 1px solid var(--c-border);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: bold;
    }

    .loot-entry-icon.quality-uncommon {
      border-color: #3f9b4a;
    }

    .loot-entry-icon.quality-rare {
      border-color: #3b78d1;
    }

    .loot-entry-icon.quality-epic {
      border-color: #9a4bd1;
    }

    .loot-entry-name {
      flex: 1;
    }

    .loot-entry-count {
      font-family: var(--font-display);
      color: var(--c-text-dim);
    }

    #loot-take-all {
      display: block;
      width: calc(100% - 16px);
      margin: 0 8px 8px;
    }

    .nameplate-npc {
      color: #8fc96a;
    }

    .npc-marker {
      margin-right: 4px;
      color: var(--c-border-bright);
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: bold;
    }

    .quest-entry {
      margin-bottom: 8px;
      font-family: var(--font-ui);
      font-size: 12px;
    }

    .quest-title {
      margin-bottom: 2px;
      color: var(--c-border-bright);
      font-weight: bold;
    }

    .quest-objective.done {
      color: #5fbf6a;
    }

    .quest-ready {
      color: var(--c-border-bright);
      font-style: italic;
    }

    #npc-window {
      left: 50%;
      top: 22%;
      width: 380px;
      transform: translateX(-50%);
    }

    #npc-body {
      padding: 12px 14px 14px;
    }

    .npc-text {
      margin: 0 0 12px;
      font-size: 14px;
      line-height: 1.45;
    }

    .npc-options {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .npc-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: var(--c-bg-panel-solid);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      border-radius: 2px;
      font-family: var(--font-ui);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }

    .npc-option:hover {
      border-color: var(--c-border-bright);
    }

    .npc-option-marker {
      width: 14px;
      color: var(--c-border-bright);
      font-family: var(--font-display);
      font-weight: bold;
      text-align: center;
    }

    .npc-option-active,
    .npc-option-active .npc-option-marker,
    .npc-option-leave {
      color: var(--c-text-dim);
    }

    .npc-objectives {
      margin: 0 0 10px;
      padding-left: 18px;
      font-size: 13px;
    }

    .npc-objectives .done {
      color: #5fbf6a;
    }

    .npc-hint {
      margin: 0 0 10px;
      color: var(--c-text-dim);
      font-size: 12px;
      font-style: italic;
    }

    .npc-rewards {
      margin-bottom: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--c-border);
    }

    .npc-rewards-title {
      margin-bottom: 4px;
      color: var(--c-border-bright);
      font-family: var(--font-display);
      font-size: 12px;
    }

    .npc-reward-line {
      margin-bottom: 4px;
      font-size: 13px;
    }

    .npc-reward-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-size: 13px;
    }

    .npc-reward-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      box-sizing: border-box;
      background: var(--c-slot-bg);
      border: 1px solid var(--c-border);
      font-family: var(--font-display);
      font-size: 12px;
    }

    .npc-reward-icon .icon {
      box-sizing: border-box;
      padding: 2px;
    }

    .npc-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    #vendor-window {
      left: 16px;
      top: 120px;
      width: 290px;
    }

    #vendor-gold {
      padding: 6px 12px 0;
      color: var(--c-border-bright);
      font-family: var(--font-display);
      font-size: 12px;
    }

    #vendor-stock {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 280px;
      padding: 8px;
      overflow-y: auto;
    }

    .vendor-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 4px 6px;
      background: var(--c-bg-panel-solid);
      color: var(--c-text);
      border: 1px solid var(--c-border);
      border-radius: 2px;
      font-family: var(--font-ui);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }

    .vendor-row:hover {
      border-color: var(--c-border-bright);
    }

    .vendor-price {
      color: var(--c-border-bright);
      font-family: var(--font-display);
    }

    .vendor-price.too-expensive {
      color: #d05040;
    }

    .window-hint {
      margin: 0;
      padding: 0 12px 10px;
      color: var(--c-text-dim);
      font-size: 11px;
      line-height: 1.35;
    }

    #menu-window {
      left: 50%;
      top: 30%;
      z-index: 40;
      width: 300px;
      transform: translateX(-50%);
    }

    .menu-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px 14px;
      font-size: 13px;
    }

    .menu-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 8px;
      align-items: center;
    }

    .menu-row input[type='range'] {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: var(--c-border-bright);
    }

    .menu-check {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #menu-credits {
      color: var(--c-border-bright);
    }

    .icon {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
    }

    .inventory-slot .icon,
    .loot-entry-icon .icon,
    .slot-icon,
    .bag-slot .icon {
      box-sizing: border-box;
      padding: 4px;
    }

    .loot-entry-icon .icon {
      padding: 2px;
    }

    .slot-icon {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .action-slot.slot-unaffordable .slot-icon {
      opacity: 0.4;
    }

    #tooltip {
      position: fixed;
      z-index: 50;
      max-width: 260px;
      padding: 8px 10px;
      background: var(--c-bg-panel-solid);
      border: 1px solid var(--c-border-bright);
      border-radius: 2px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
      color: var(--c-text);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.35;
      pointer-events: none;
    }

    #tooltip.hidden,
    #item-menu.hidden {
      display: none;
    }

    .tooltip-name {
      margin-bottom: 2px;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: bold;
    }

    .quality-text-common {
      color: var(--c-text);
    }

    .quality-text-uncommon {
      color: #4fbf5a;
    }

    .quality-text-rare {
      color: #5a9bf0;
    }

    .quality-text-epic {
      color: #b46ee0;
    }

    .tooltip-ability {
      color: var(--c-border-bright);
    }

    .tooltip-dim {
      color: var(--c-text-dim);
    }

    .tooltip-use {
      color: #5fbf6a;
    }

    .tooltip-bad {
      color: #d05040;
    }

    .tooltip-desc {
      margin-top: 4px;
      color: var(--c-text-dim);
      font-style: italic;
    }

    #item-menu {
      position: fixed;
      z-index: 60;
      display: flex;
      flex-direction: column;
      min-width: 130px;
      background: var(--c-bg-panel-solid);
      border: 1px solid var(--c-border-bright);
      border-radius: 2px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.7);
    }

    .item-menu-button {
      padding: 6px 12px;
      background: none;
      border: none;
      color: var(--c-text);
      font-family: var(--font-ui);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }

    .item-menu-button:hover {
      background: #26241c;
      color: var(--c-border-bright);
    }

    .item-menu-danger {
      color: #d05040;
    }

    #confirm-dialog {
      left: 50%;
      top: 38%;
      z-index: 70;
      width: 300px;
      transform: translate(-50%, -50%);
    }

    #confirm-text {
      margin: 0;
      padding: 14px 14px 6px;
      font-size: 14px;
      line-height: 1.4;
    }

    .confirm-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 8px 12px 12px;
    }

    .window-button-danger {
      color: #d05040;
      border-color: #d05040;
    }

    #character-window {
      left: 280px;
      top: 110px;
      width: 250px;
    }

    .equipment-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 10px;
    }

    .equipment-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .equipment-slot-label {
      font-size: 11px;
      color: var(--c-text-dim);
    }

    .character-stats {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 3px 12px;
      margin: 0;
      padding: 4px 12px 12px;
      font-size: 13px;
    }

    .character-stats dt {
      color: var(--c-text-dim);
    }

    .character-stats dd {
      margin: 0;
      text-align: right;
      font-family: var(--font-display);
    }

    #gold-display {
      position: fixed;
      bottom: 60px;
      right: 16px;
      font-family: var(--font-display);
      font-size: 13px;
      color: var(--c-border-bright);
      text-shadow: 0 1px 2px #000000;
    }

    #xp-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: var(--c-slot-bg);
      border-top: 1px solid var(--c-border);
    }

    #xp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--c-xp-b), var(--c-xp-a));
      transition: width 0.3s ease;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="nameplates"></div>

  <div id="hud">
    <div id="player-frame" class="frame">
      <div class="portrait"></div>
      <div class="frame-info">
        <div class="name-level">
          <span id="player-name">—</span>
          <span id="player-level" class="level-badge">1</span>
        </div>
        <div class="bar health-bar">
          <div id="player-health-fill" class="bar-fill"></div>
          <span id="player-health-text" class="bar-text">100 / 100</span>
        </div>
        <div class="bar resource-bar">
          <div id="player-resource-fill" class="bar-fill"></div>
          <span id="player-resource-text" class="bar-text">100 / 100</span>
        </div>
      </div>
    </div>

    <div id="target-frame" class="frame hidden">
      <div class="portrait"></div>
      <div class="frame-info">
        <div class="name-level">
          <span id="target-name">—</span>
          <span id="target-level" class="level-badge">?</span>
        </div>
        <div class="bar health-bar">
          <div id="target-health-fill" class="bar-fill"></div>
        </div>
      </div>
    </div>

    <div id="cast-bar" class="hidden">
      <div id="cast-bar-fill" class="bar-fill"></div>
      <span id="cast-bar-label" class="bar-text"></span>
    </div>

    <div id="minimap">
      <div id="minimap-circle"></div>
      <div id="zone-name">Ödland – Sektor 7</div>
      <div id="minimap-buttons">
        <button title="Charakter">C</button>
        <button title="Fähigkeiten">F</button>
        <button title="Perks">P</button>
        <button title="Missionen">Q</button>
        <button title="Erfolge">E</button>
        <button title="Gruppe">G</button>
        <button title="Menü">M</button>
      </div>
      <div id="buff-bar"></div>
    </div>

    <div id="quest-tracker">
      <div class="panel-title">Missionen</div>
      <div id="quest-list" class="empty-state">Keine aktiven Missionen</div>
    </div>

    <div id="action-bar">
      <div class="action-slot"><span class="slot-key">1</span></div>
      <div class="action-slot"><span class="slot-key">2</span></div>
      <div class="action-slot"><span class="slot-key">3</span></div>
      <div class="action-slot"><span class="slot-key">4</span></div>
      <div class="action-slot"><span class="slot-key">5</span></div>
      <div class="action-slot"><span class="slot-key">6</span></div>
      <div class="action-slot"><span class="slot-key">7</span></div>
      <div class="action-slot"><span class="slot-key">8</span></div>
      <div class="action-slot"><span class="slot-key">9</span></div>
      <div class="action-slot"><span class="slot-key">0</span></div>
      <div class="action-slot"><span class="slot-key">-</span></div>
      <div class="action-slot"><span class="slot-key">=</span></div>
    </div>

    <div id="chat-window">
      <div id="chat-messages"></div>
      <input id="chat-input" type="text" placeholder="Chat noch nicht verfügbar" disabled>
    </div>

    <div id="bag-bar">
      <button class="bag-slot" title="Rucksack"></button>
      <button class="bag-slot" title="Tasche"></button>
      <button class="bag-slot" title="Tasche"></button>
      <button class="bag-slot" title="Tasche"></button>
    </div>

    <div id="gold-display"><span id="gold-amount">0</span> Gold</div>

    <div id="xp-bar">
      <div id="xp-fill"></div>
    </div>
  </div>

  <div id="dialogue-box" class="hidden">
    <p id="dialogue-text"></p>
    <button id="dialogue-close">Schließen</button>
  </div>

  <div id="inventory-window" class="window hidden">
    <div class="window-header">
      <span class="window-title">Rucksack</span>
      <button id="inventory-close" class="window-close" title="Schließen">×</button>
    </div>
    <div id="inventory-grid"></div>
  </div>

  <div id="loot-window" class="window hidden">
    <div class="window-header">
      <span id="loot-title" class="window-title">Beute</span>
      <button id="loot-close" class="window-close" title="Schließen">×</button>
    </div>
    <div id="loot-entries"></div>
    <button id="loot-take-all" class="window-button">Alles nehmen</button>
  </div>

  <div id="npc-window" class="window hidden">
    <div class="window-header">
      <span id="npc-title" class="window-title">Gespräch</span>
      <button id="npc-close" class="window-close" title="Schließen">×</button>
    </div>
    <div id="npc-body"></div>
  </div>

  <div id="vendor-window" class="window hidden">
    <div class="window-header">
      <span id="vendor-title" class="window-title">Händler</span>
      <button id="vendor-close" class="window-close" title="Schließen">×</button>
    </div>
    <div id="vendor-gold"></div>
    <div id="vendor-stock"></div>
    <p class="window-hint">Klick: 1 kaufen. Umschalt+Klick: bis zu 5 kaufen. Rechtsklick auf Gegenstände im Rucksack verkauft sie.</p>
  </div>

  <div id="menu-window" class="window hidden">
    <div class="window-header">
      <span class="window-title">Menü</span>
      <button id="menu-close" class="window-close" title="Schließen">×</button>
    </div>
    <div class="menu-body">
      <div class="menu-row">
        <label for="menu-volume">Gesamtlautstärke</label>
        <span id="menu-volume-value"></span>
        <input id="menu-volume" type="range" min="0" max="100" step="1">
      </div>
      <div class="menu-row">
        <label for="menu-ambient">Umgebung</label>
        <span id="menu-ambient-value"></span>
        <input id="menu-ambient" type="range" min="0" max="100" step="1">
      </div>
      <label class="menu-check"><input id="menu-muted" type="checkbox"> Ton aus</label>
      <a id="menu-credits" href="#" target="_blank" rel="noopener">Credits</a>
    </div>
  </div>

  <div id="character-window" class="window hidden">
    <div class="window-header">
      <span class="window-title">Charakter</span>
      <button id="character-close" class="window-close" title="Schließen">×</button>
    </div>
    <div id="equipment-grid" class="equipment-grid"></div>
    <dl id="character-stats" class="character-stats"></dl>
  </div>

  <div id="confirm-dialog" class="window hidden">
    <p id="confirm-text"></p>
    <div class="confirm-buttons">
      <button id="confirm-yes" class="window-button window-button-danger">Zerstören</button>
      <button id="confirm-no" class="window-button">Abbrechen</button>
    </div>
  </div>

  <div id="item-menu" class="hidden"></div>
  <div id="tooltip" class="hidden"></div>

  <script src="js/vendor/howler.min.js"></script>
  <script type="module" src="js/main.js?v=24"></script>
</body>
</html>
